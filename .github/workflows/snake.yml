name: Generate profile visuals

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile source
        uses: actions/checkout@v4

      - name: Generate animated language overview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/generate_language_stats.py
          --username "${{ github.repository_owner }}"
          --output dist/languages.svg
          --include-forks

      - name: Generate isometric contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/generate_contribution_calendar.py
          --username "${{ github.repository_owner }}"
          --output dist/contributions-3d.svg

      - name: Publish visuals to output branch
        if: github.ref_name == github.event.repository.default_branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
