<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">InitLoader</title>
  <desc id="desc">Animated neon developer banner for game systems, native tooling, and reverse engineering</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0a1022"/>
      <stop offset="1" stop-color="#10071c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#65e6ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#65e6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6d7ba7" stroke-width=".55" opacity=".2"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <clipPath id="frame"><rect x="14" y="14" width="1172" height="332" rx="22"/></clipPath>
    <style>
      .trace{stroke-dasharray:9 15;animation:flow 5s linear infinite}.pulse{animation:pulse 3.2s ease-in-out infinite}.scan{animation:scan 6s linear infinite}.cursor{animation:blink 1s steps(2,end) infinite}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes scan{0%{transform:translateY(-80px);opacity:0}15%,85%{opacity:.22}100%{transform:translateY(440px);opacity:0}}@keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="155" cy="84" r="220" fill="url(#orb)" filter="url(#soft)" class="pulse"/>
    <circle cx="1040" cy="290" r="260" fill="#8b5cf6" opacity=".11" filter="url(#soft)"/>
    <path d="M-20 286C185 186 288 328 476 224S825 106 1220 210" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".38" class="trace"/>
    <path d="M-30 78C210 184 368 12 570 104s292 190 660 80" fill="none" stroke="url(#neon)" stroke-width="1.4" opacity=".26" class="trace" style="animation-direction:reverse;animation-duration:7s"/>
    <g fill="none" stroke="#65e6ff" stroke-width="1.4" opacity=".55">
      <path d="M70 110h96l34 34h108"/><circle cx="70" cy="110" r="4" fill="#65e6ff"/>
      <path d="M1130 248h-114l-28-28h-85"/><circle cx="1130" cy="248" r="4" fill="#65e6ff"/>
    </g>
    <rect x="0" y="-80" width="1200" height="70" fill="url(#neon)" opacity=".14" filter="url(#soft)" class="scan"/>
  </g>

  <rect x="14" y="14" width="1172" height="332" rx="22" fill="none" stroke="url(#neon)" stroke-width="1.4" opacity=".72"/>
  <path d="M46 70V46h24M1130 46h24v24M46 290v24h24M1154 290v24h-24" fill="none" stroke="#65e6ff" stroke-width="2" opacity=".9"/>

  <g text-anchor="middle" font-family="JetBrains Mono,Consolas,monospace">
    <text x="600" y="105" fill="#64748b" font-size="14" letter-spacing="5">SYSTEM PROFILE // ONLINE</text>
    <text x="600" y="205" fill="url(#neon)" font-size="72" font-weight="800" letter-spacing="5" filter="url(#glow)">INIT//LOADER</text>
    <text x="600" y="205" fill="#eefaff" font-size="72" font-weight="800" letter-spacing="5">INIT//LOADER</text>
    <text x="600" y="250" fill="#a9b8d4" font-size="18" letter-spacing="3">GAME SYSTEMS  •  NATIVE TOOLING  •  REVERSE ENGINEERING</text>
    <text x="600" y="296" fill="#65e6ff" font-size="14">root@github:~$ build --beyond-the-surface<tspan class="cursor">_</tspan></text>
  </g>

  <circle cx="54" cy="44" r="4" fill="#22d3ee" class="pulse"/>
  <circle cx="72" cy="44" r="4" fill="#8b5cf6" class="pulse" style="animation-delay:.35s"/>
  <circle cx="90" cy="44" r="4" fill="#ec4899" class="pulse" style="animation-delay:.7s"/>
</svg>
