      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".22" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset=".78" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
